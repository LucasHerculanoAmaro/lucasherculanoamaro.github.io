name: Deploy Angular para GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependências
        run: npm install

      - name: Instalar Angular CLI
        run: npm install -g @angular/cli

      - name: Build do projeto Angular
        run: ng build --base-href=/ --configuration production

      - name: Criar arquivo .nojekyll
        run: echo "" > dist/browser/.nojekyll

      - name: Criar 404.html para rotas do Angular
        run: |
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Redirecionando...</title><script>var path = window.location.pathname;var query = window.location.search || "";var hash = window.location.hash || "";window.location.replace("/index.html?redirect=" + path + query + hash);</script></head><body><p>Redirecionando para a aplicação...</p></body></html>' > dist/browser/404.html

      - name: Deploy no GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/browser
