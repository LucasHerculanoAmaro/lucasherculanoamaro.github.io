name: Deploy Angular para GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependências
        run: npm install

      - name: Instalar Angular CLI
        run: npm install -g @angular/cli

      - name: Build do projeto Angular
        run: ng build --base-href=/lucasherculanoamaro.github.io/

      - name: Criar arquivo .nojekyll
        run: echo "" > dist//browser/.nojekyll

      - name: Deploy no GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/browser
